<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>TecnoCell — espelho do SIGE</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 30rem; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 { font-size: 1.15rem; color: #1B6CA8; margin-bottom: .25rem; }
    p.sub { color: #666; font-size: .85rem; margin-top: 0; }
    label { display: block; margin-top: 1rem; font-size: .82rem; font-weight: 600; }
    input { width: 100%; padding: .5rem; margin-top: .25rem; border: 1px solid #ccc; border-radius: .35rem; font-size: .9rem; }
    button { margin-top: 1.25rem; background: #1B6CA8; color: #fff; border: 0; padding: .6rem 1.2rem; border-radius: .35rem; font-size: .9rem; cursor: pointer; }
    #ok { color: #157347; font-size: .85rem; margin-top: .75rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>Espelho do SIGE</h1>
  <p class="sub">Configure uma vez por máquina. O nome ajuda a saber de qual PC veio cada registro.</p>

  <label>Nome desta máquina
    <input id="maquina" placeholder="ex.: balcao-1-petropolis">
  </label>
  <label>URL do Supabase
    <input id="url" placeholder="https://xxxx.supabase.co">
  </label>
  <label>Chave anon
    <input id="key" type="password" placeholder="eyJ...">
  </label>

  <button id="salvar">Salvar</button>
  <div id="ok"></div>

  <script src="opcoes.js"></script>
</body>
</html>
