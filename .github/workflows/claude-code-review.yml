name: Claude Code Review

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Revise o diff do último commit (`git diff HEAD~1..HEAD`, ou o
            diff do PR se for um pull_request). Foque em bugs reais,
            segurança e regressão de lógica — não em estilo. Reporte só o
            que encontrar; se não achar nada relevante, diga isso.
