<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>TecnoCell — captura SIGE (sombra)</title></head>
<body>
  <h1>Captura SIGE (sombra)</h1>
  <p>Configura a loja e a chave. A chave é gerada por scripts-sinc/gerar-credencial.mjs.</p>
  <label>Loja (id da credencial): <input id="loja" type="text" placeholder="ex.: PETROPOLIS"></label><br><br>
  <label>Chave (Bearer): <input id="chave" type="password" size="60"></label><br><br>
  <label>URL do TecnoCell: <input id="url" type="text" placeholder="https://tecnocell-cloud.vercel.app"></label><br><br>
  <button id="salvar">Salvar</button>
  <p id="ok"></p>
  <script src="opcoes.js"></script>
</body>
</html>
